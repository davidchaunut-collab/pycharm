<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ma page web</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background-image: url("img1.png");
      background-size: cover;       /* l'image remplit tout l'écran */
      background-position: center;  /* image centrée */
      background-repeat: no-repeat; /* pas de répétition */
      background-attachment: fixed; /* l'image reste fixe au défilement */

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1, a {
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7); /* texte lisible sur l'image */
    }

    a {
      color: white;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <h1>Bienvenue sur ma page</h1>
  <p>
    <a href="https://www.example.com" target="_blank">Cliquez ici pour visiter un site</a>
  </p>
</body>
</html>
